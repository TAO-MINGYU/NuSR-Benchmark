[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nusr-nuclear-benchmark"
version = "1.0.0"
description = "Frozen nuclear-structure expression-recovery and observable-prediction question bank"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
license = {text = "MIT (software only; source data retain their original terms)"}

[project.optional-dependencies]
symbolic = ["sympy>=1.12"]
test = ["sympy>=1.12"]

[project.scripts]
nuclearbench = "nuclearbench.cli:main"

[tool.setuptools]
packages = ["nuclearbench"]

[tool.ruff]
line-length = 100
target-version = "py310"
